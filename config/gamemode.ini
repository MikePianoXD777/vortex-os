; Vortexine's OS: config de gamemode (~/.config/gamemode.ini).
; Se activa con «gamemoderun %command%» en las opciones de lanzamiento de Steam.
[general]
; Sube la prioridad del juego.
renice=10
softrealtime=auto
inhibit_screensaver=1

[custom]
; Mientras juegas: sin animaciones, desenfoque ni sombras, y CPU en modo rendimiento.
start=/usr/local/bin/vortex modo-juego on
end=/usr/local/bin/vortex modo-juego off
