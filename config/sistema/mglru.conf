# Vortex: protección contra thrashing de MGLRU (/etc/tmpfiles.d/90-vortex-mglru.conf).
# Fuente: https://docs.kernel.org/admin-guide/mm/multigen_lru.html («Thrashing prevention»)
# min_ttl_ms = 0 (lo de serie). Hasta la 2.6.2 era 1000, y el kernel llamaba al OOM killer si no podía
# respetar ese segundo, aunque quedara swap libre: a un amigo con 8 GB se le cerraban apps como Discord.
# Medido en una VM de 8 GB con zram, 4 procesos llenando memoria (docs/notas-2.6.3.md):
#   12 GB en total: con 1000, de 1 a 18 muertes por ronda; con 0, ninguna y sin tirones.
#   16 y 20 GB (ya no cabe): el OOM salta con los dos; con 0, el peor tirón sube de ~2 s a ~3,5 s.
w /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 0
