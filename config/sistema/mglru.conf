# Vortex: protección contra thrashing de MGLRU (/etc/tmpfiles.d/90-vortex-mglru.conf).
# Fuente: https://docs.kernel.org/admin-guide/mm/multigen_lru.html («Thrashing prevention»)
# min_ttl_ms = 1000: el kernel no saca de la RAM lo que se usó en el último segundo.
# Cuando la RAM se llena, en vez de congelarse todo (el sistema tirando y volviendo a
# leer las mismas páginas), salta el OOM killer con lo que no se está usando. La
# documentación da 1000 como el valor que quita los congelones intolerables (el retraso
# que nota una persona es ~100 ms) y lo recomienda a escritorios sin oomd: Vortex apaga
# systemd-oomd con 8 GB o más. Valores más altos arriesgan matar apps antes de tiempo.
w /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
