# Vortexine's OS 4.0: al prender la PC se entra directo a Vortex Shell y la contraseña se pone en su
# pantalla de bloqueo ([initial_session], la agrega «vortex actualizar» o el instalador con tu usuario).
# Al cerrar sesión sale la pantalla de inicio gráfica (vortex-greeter); si esa falla, la de texto
# (tuigreet). La sesión arranca con stdin a /dev/null (config/greeter/entrar): si heredara /dev/tty1,
# cualquier programa del inicio que pregunte algo se quedaría esperando para siempre una respuesta.
[terminal]
vt = 1

[default_session]
command = "/usr/local/bin/vortex-greeter"
user = "greeter"
