# Vortex OS: pantalla de inicio en texto (tuigreet). Recuerda el último usuario.
# La sesión arranca con stdin a /dev/null (greetd la lanza con «sh -c»): si heredara
# /dev/tty1, «trash-empty 30» de Caelestia se quedaría esperando un «Proceed?» para
# siempre (~24 MB) y la papelera nunca se vaciaría.
[terminal]
vt = 1

[default_session]
command = "tuigreet --time --remember --remember-session --asterisks --cmd \"start-hyprland </dev/null\""
user = "greeter"
