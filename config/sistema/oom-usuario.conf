# Vortex: /etc/systemd/user.conf.d/90-vortex-oom.conf
# Si el kernel mata un proceso de una app por falta de memoria, systemd no cierra el resto de la app.
# Con el «stop» de serie, perder un renderer cerraba Discord completo, y lo mismo a cualquier app con
# su propio scope: las de Flatpak y las que ordena vortex-gestor. Chromium y Electron saben reponer un
# renderer; solo necesitan seguir vivos.
# Fuente: man systemd.service («OOMPolicy=») y man systemd-system.conf («DefaultOOMPolicy=»).
[Manager]
DefaultOOMPolicy=continue
