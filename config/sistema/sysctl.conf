# Vortexine's OS: se suma a 70-cachyos-settings.conf (que ya ajusta swappiness, zram y caché).
# Algunos juegos (Star Citizen, títulos de Proton con anticheat) piden muchos mapas de memoria.
vm.max_map_count = 2147483642
# Evita que la mitigación de "split lock" frene juegos viejos.
kernel.split_lock_mitigate = 0

# --- Vortex: memoria sin tirones ---
# Fuente de cada valor: https://docs.kernel.org/admin-guide/sysctl/vm.html
# Lo que cachyos-settings ya deja bien y aquí NO se repite:
#   vm.page-cluster = 0 (70-cachyos-settings.conf): sin lectura anticipada de swap; con
#     zram leer 1 página es instantáneo y traer 8 de golpe solo agrega latencia al fallo.
#   vm.swappiness = 150 (regla udev 30-zram.rules, solo cuando zram0 existe): el kernel
#     recomienda pasar de 100 con swap en memoria como zram; no se fija aquí para no
#     forzar 150 en un equipo sin zram.
#   zram (zram-generator.conf): tamaño = RAM, zstd. zstd comprime ~3:1 contra ~2:1 de
#     lz4 (más RAM libre, que es la meta) y descomprimir 4 KB cuesta microsegundos,
#     nada frente a un cuadro de 16 ms; se queda zstd.
#
# Compactación proactiva: kcompactd desfragmenta en segundo plano aunque nadie pida
# páginas grandes, y ese trabajo puede caer en mitad de un juego. 0 = compactar solo
# cuando hace falta. linux-cachyos ya trae 0; el kernel de Arch que queda de respaldo
# trae 20, así que se fija para que los dos se porten igual.
vm.compaction_proactiveness = 0
# Refuerzo de las marcas de agua: tras fragmentarse la memoria, kswapd libera de golpe
# hasta 150 % de la marca alta (15000, valor de serie de Arch) para ayudar a la
# compactación: ráfagas de reclamo que se notan como tirones. linux-cachyos ya trae 0;
# se fija por el kernel de respaldo.
vm.watermark_boost_factor = 0
# Distancia entre marcas de agua, en diezmilésimas de la RAM. De serie 10 = 0,1 %
# (16 MB en 16 GB): tan poco margen que un juego que pide memoria de golpe cae en
# «reclamo directo» (su propio hilo se pone a liberar memoria = tirón). 100 = 1 %
# (~160 MB en 16 GB): kswapd despierta antes y libera en segundo plano.
vm.watermark_scale_factor = 100
