# Vortex OS: se suma a 70-cachyos-settings.conf (que ya ajusta swappiness, zram y caché).
# Algunos juegos (Star Citizen, títulos de Proton con anticheat) piden muchos mapas de memoria.
vm.max_map_count = 2147483642
# Evita que la mitigación de "split lock" frene juegos viejos.
kernel.split_lock_mitigate = 0
