# Vortex: páginas grandes transparentes (THP). Se instala como /etc/tmpfiles.d/thp.conf
# para reemplazar el thp.conf de cachyos-settings (mismo nombre = lo sustituye; con otro
# nombre las dos líneas chocarían y systemd-tmpfiles avisaría «duplicate line»).
# Fuente: https://docs.kernel.org/admin-guide/mm/transhuge.html
#
# enabled = madvise: páginas de 2 MB solo para quien las pide con madvise (Java con
# -XX:+UseTransparentHugePages, glibc con GLIBC_TUNABLES=glibc.malloc.hugetlb=1). Con «always»
# (lo de serie en linux-cachyos) cualquier programa infla su RAM con páginas medio
# vacías; la documentación lo advierte. Menos RAM usada sin perder donde sí ayudan.
w! /sys/kernel/mm/transparent_hugepage/enabled - - - - madvise
# defrag = defer: si no hay una página grande libre, el programa sigue con páginas
# normales y kswapd/kcompactd preparan una en segundo plano (khugepaged la junta
# después). Con «defer+madvise» (cachyos) las zonas con madvise —justo el heap de
# Java— se quedan esperando a que se compacte la memoria: eso es un tirón.
w! /sys/kernel/mm/transparent_hugepage/defrag - - - - defer
# shmem_enabled = advise: ZGC guarda el heap de Java en memoria compartida (memfd); sin
# esto -XX:+UseTransparentHugePages no hace nada con ZGC (wiki de ZGC de OpenJDK,
# «Enabling Transparent Huge Pages»). linux-cachyos ya trae advise; Arch trae never.
w! /sys/kernel/mm/transparent_hugepage/shmem_enabled - - - - advise
