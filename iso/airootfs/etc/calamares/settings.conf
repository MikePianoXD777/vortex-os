# Vortexine's OS: instalador gráfico (Calamares). Las configs de Vortex van como «instancias»
# (<módulo>_vortex.conf, <módulo>@vortex) para no chocar con los archivos de cachyos-calamares.
# Instala copiando el sistema del USB al disco
# (unpackfs, sin internet) y después pone las apps que elijas (con internet).
# Arranque: systemd-boot en UEFI y GRUB en BIOS. grubcfg@vortex (escribe /etc/default/grub, que en
# UEFI no se usa) y vortex-bios (módulo propio, ver usr/lib/calamares/modules/vortex-bios/main.py; en UEFI no hace
# nada) preparan el GRUB de BIOS antes de bootloader@vortex.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: vortex
    module: bootloader
    config: bootloader_vortex.conf
  - id: vortex
    module: finished
    config: finished_vortex.conf
  - id: vortex
    module: grubcfg
    config: grubcfg_vortex.conf
  - id: vortex
    module: keyboard
    config: keyboard_vortex.conf
  - id: vortex
    module: locale
    config: locale_vortex.conf
  - id: vortex
    module: netinstall
    config: netinstall_vortex.conf
  - id: vortex
    module: packages
    config: packages_vortex.conf
  - id: vortex
    module: partition
    config: partition_vortex.conf
  - id: vortex
    module: services-systemd
    config: services-systemd_vortex.conf
  - id: vortex
    module: unpackfs
    config: unpackfs_vortex.conf
  - id: vortex
    module: users
    config: users_vortex.conf
  - id: vortex
    module: welcome
    config: welcome_vortex.conf
  - id: vortex-imagen
    module: shellprocess
    config: shellprocess_vortex-imagen.conf
  - id: vortex-kernel
    module: shellprocess
    config: shellprocess_vortex-kernel.conf
  - id: vortex-pacman
    module: shellprocess
    config: shellprocess_vortex-pacman.conf
  - id: vortex-actualizar
    module: shellprocess
    config: shellprocess_vortex-actualizar.conf
  - id: vortex-final
    module: shellprocess
    config: shellprocess_vortex-final.conf
  - id: vortex-arranque
    module: shellprocess
    config: shellprocess_vortex-arranque.conf

sequence:
  - show:
      - welcome@vortex
      - locale@vortex
      - keyboard@vortex
      - partition@vortex
      - users@vortex
      - netinstall@vortex
      - summary
  - exec:
      - partition@vortex
      - mount
      - shellprocess@vortex-imagen
      - unpackfs@vortex
      - machineid
      - fstab
      - locale@vortex
      - keyboard@vortex
      - localecfg
      - shellprocess@vortex-kernel
      - initcpiocfg
      - initcpio
      - users@vortex
      - networkcfg
      - hwclock
      - services-systemd@vortex
      - shellprocess@vortex-pacman
      - shellprocess@vortex-actualizar
      - packages@vortex
      - shellprocess@vortex-final
      - grubcfg@vortex
      - vortex-bios
      - bootloader@vortex
      - shellprocess@vortex-arranque
      - umount
  - show:
      - finished@vortex

branding: vortex
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
