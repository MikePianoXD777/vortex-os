# Vortex OS: instalador gráfico (Calamares). Las configs de Vortex van como «instancias»
# (<módulo>_vortex.conf, <módulo>@vortex) para no chocar con los archivos de cachyos-calamares.
# Instala copiando el sistema del USB al disco
# (unpackfs, sin internet) y después pone las apps que elijas (con internet).
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: vortex
    module: bootloader
    config: bootloader_vortex.conf
  - id: vortex
    module: finished
    config: finished_vortex.conf
  - id: vortex
    module: locale
    config: locale_vortex.conf
  - id: vortex
    module: netinstall
    config: netinstall_vortex.conf
  - id: vortex
    module: packages
    config: packages_vortex.conf
  - id: vortex
    module: partition
    config: partition_vortex.conf
  - id: vortex
    module: services-systemd
    config: services-systemd_vortex.conf
  - id: vortex
    module: unpackfs
    config: unpackfs_vortex.conf
  - id: vortex
    module: users
    config: users_vortex.conf
  - id: vortex
    module: welcome
    config: welcome_vortex.conf
  - id: vortex-kernel
    module: shellprocess
    config: shellprocess_vortex-kernel.conf
  - id: vortex-pacman
    module: shellprocess
    config: shellprocess_vortex-pacman.conf
  - id: vortex-final
    module: shellprocess
    config: shellprocess_vortex-final.conf

sequence:
  - show:
      - welcome@vortex
      - locale@vortex
      - keyboard
      - partition@vortex
      - users@vortex
      - netinstall@vortex
      - summary
  - exec:
      - partition@vortex
      - mount
      - unpackfs@vortex
      - machineid
      - fstab
      - locale@vortex
      - keyboard
      - localecfg
      - shellprocess@vortex-kernel
      - initcpiocfg
      - initcpio
      - users@vortex
      - networkcfg
      - hwclock
      - services-systemd@vortex
      - shellprocess@vortex-pacman
      - packages@vortex
      - shellprocess@vortex-final
      - bootloader@vortex
      - umount
  - show:
      - finished@vortex

branding: vortex
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
