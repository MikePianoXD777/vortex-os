# btrfs por defecto: así el instalador de Vortex puede crear puntos de restauración (snapper).
#
# initialPartitioningChoice: none → no hay nada preseleccionado: quien instala tiene que elegir
# «Borrar disco», «Instalar junto a», etc. (con «erase» de entrada bastaba pulsar Siguiente, también
# en un disco con Windows).
#
# Sin defaultPartitionTableType: Calamares usa GPT en UEFI y MBR (msdos) en BIOS. Con «gpt» fijo, en
# BIOS GRUB no tendría dónde incrustarse (haría falta una partición bios_grub que Calamares no
# crea sola) y la instalación quedaría sin gestor de arranque.
#
# efi.minimumSize: lo que debe medir una partición EFI que ya existe (junto a Windows mide 100-260
# MB). Si no se pone, Calamares la iguala al tamaño recomendado (2048M) y avisa «debe medir al menos
# 2048 MiB» a casi cualquiera. Con ~300 MB caben los dos kernels; con menos, vortex-post-instalacion
# deja solo linux-cachyos (y con menos de ~150 MB libres no cabe ni uno: particionado manual).
---
efiSystemPartition: "/boot"
efiSystemPartitionSize: 2048M
efiSystemPartitionName: EFI
efi:
  minimumSize: 300MiB
userSwapChoices: [ none, file ]
initialSwapChoice: none
luksGeneration: luks2
drawNestedPartitions: false
alwaysShowPartitionLabels: true
initialPartitioningChoice: none
defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4", "xfs" ]
