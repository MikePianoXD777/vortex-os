# Deja el sistema instalado como uno normal: sin nada del USB, con los drivers de tu GPU
# (chwd; sin internet quedan pendientes y vortex-gpu.service los instala al haber red), el menú
# de GRUB en BIOS y los servicios que tocan según tu equipo.
---
dontChroot: false
timeout: 3600
script:
  - command: "/usr/local/bin/vortex-post-instalacion final ${USER}"
    timeout: 3600
i18n:
  name: "Finishing Vortexine's OS"
  name[es]: "Terminando Vortexine's OS"
