# Deja el sistema instalado como uno normal: sin nada del USB, con los drivers de tu GPU
# (chwd) y los servicios que tocan según tu equipo.
---
dontChroot: false
timeout: 3600
script:
  - command: "/usr/local/bin/vortex-post-instalacion final ${USER}"
    timeout: 3600
i18n:
  name: "Finishing Vortex OS"
  name[es]: "Terminando Vortex OS"
