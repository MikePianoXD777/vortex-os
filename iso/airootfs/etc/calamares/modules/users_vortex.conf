---
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - name: wheel
    must_exist: false
    system: true
  - audio
  - video
  - input
  - lp
  - network
  - rfkill
  - storage
  - sys
  - name: gamemode
    must_exist: false
    system: true
# La casilla «Iniciar sesión automáticamente» se ve (displayAutologin) y empieza sin marcar
# (doAutologin). Con ella marcada, Calamares crea el grupo autologinGroup y mete ahí al usuario;
# vortex-post-instalacion (inicio-automatico) lo ve y le pone [initial_session] a greetd. Sin
# marcarla no hay grupo ni cambios: queda tuigreet pidiendo la contraseña.
displayAutologin: true
doAutologin: false
autologinGroup: autologin
sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: false
doReusePassword: true
passwordRequirements:
  minLength: 4
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
  forbidden_names: [ root, liveuser, greeter, nobody ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "${login}-vortex"
  forbidden_names: [ localhost ]
