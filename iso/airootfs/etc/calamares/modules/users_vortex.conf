---
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - name: wheel
    must_exist: false
    system: true
  - audio
  - video
  - input
  - lp
  - network
  - rfkill
  - storage
  - sys
  - name: gamemode
    must_exist: false
    system: true
doAutologin: false
sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: false
doReusePassword: true
passwordRequirements:
  minLength: 4
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
  forbidden_names: [ root, liveuser, greeter, nobody ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "${login}-vortex"
  forbidden_names: [ localhost ]
