# Antes de copiar el sistema: si el arranque lo copió a la RAM (copytoram) y soltó la USB, deja la
# imagen donde la busca unpackfs. Fuera del chroot: todavía no hay sistema instalado.
---
dontChroot: true
timeout: 60
script:
  - command: "/usr/local/bin/vortex-post-instalacion imagen"
    timeout: 60
i18n:
  name: "Finding the Vortexine's OS image"
  name[es]: "Buscando la imagen de Vortexine's OS"
