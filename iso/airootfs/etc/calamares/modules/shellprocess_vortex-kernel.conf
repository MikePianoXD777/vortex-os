# Quita lo que el arranque del USB necesita y pone los kernels en /boot (los pasos
# initcpiocfg e initcpio generan después el initramfs normal).
---
dontChroot: false
timeout: 600
script:
  - command: "/usr/local/bin/vortex-post-instalacion kernel"
    timeout: 600
i18n:
  name: "Preparing the boot of Vortex OS"
  name[es]: "Preparando el arranque de Vortex OS"
