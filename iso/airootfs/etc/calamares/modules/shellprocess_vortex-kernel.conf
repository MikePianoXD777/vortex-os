# Quita lo que el arranque del USB necesita y pone los kernels en /boot (los pasos
# initcpiocfg e initcpio generan después el initramfs normal, sin la imagen fallback). Si /boot
# es una partición EFI chica (junto a Windows), deja solo linux-cachyos.
---
dontChroot: false
timeout: 600
script:
  - command: "/usr/local/bin/vortex-post-instalacion kernel"
    timeout: 600
i18n:
  name: "Preparing the boot of Vortexine's OS"
  name[es]: "Preparando el arranque de Vortexine's OS"
