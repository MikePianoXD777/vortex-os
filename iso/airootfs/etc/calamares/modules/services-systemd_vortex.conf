# Lo que deja encendido install.sh (el resto ya viene activado en la imagen).
---
units:
  - name: NetworkManager
    action: enable
    mandatory: true
  - name: greetd
    action: enable
    mandatory: true
  - name: scx_loader
    action: enable
    mandatory: false
  - name: power-profiles-daemon
    action: enable
    mandatory: false
  - name: vortex-flatpaks
    action: enable
    mandatory: false
  # TRIM semanal para SSD y NVMe (también viene en el preset de la imagen; aquí queda explícito
  # por si el preset no se aplicó).
  - name: fstrim.timer
    action: enable
    mandatory: false
