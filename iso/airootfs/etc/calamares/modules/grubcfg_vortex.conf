# /etc/default/grub para GRUB, que solo se usa en PC con BIOS (en UEFI es systemd-boot y esto no
# se usa). El módulo agrega lo que depende del disco elegido: root= o cryptdevice=/rd.luks.uuid
# si es cifrado, GRUB_ENABLE_CRYPTODISK, resume= si hay swap, y el nombre «Vortexine's OS» (el
# bootloaderEntryName del branding). El resto del menú (kernel por defecto, os-prober, tiempo) lo
# pone vortex-post-instalacion en /etc/default/grub.d/10-vortex.cfg.
---
overwrite: false
prefer_grub_d: false
kernel_params: [ "quiet", "nowatchdog" ]
