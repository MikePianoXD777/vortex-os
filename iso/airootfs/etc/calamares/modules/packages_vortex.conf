# Instala las apps elegidas en la pantalla «Apps y juegos» (netinstall). Sin internet se
# salta: Vortex queda instalado igual y las apps se pueden poner después.
#
# update_db: false a propósito. «update_db: true» hace «pacman -Sy» y luego «pacman -S» de cada
# app: una actualización parcial (la ISO tiene semanas o meses; los sonames de los repos ya
# cambiaron), y si ese -Sy falla el módulo aborta la instalación ya formateado el disco. El paso
# anterior, shellprocess@vortex-actualizar, ya sincroniza las bases y actualiza el sistema entero
# (con red, y sin abortar si falla).
---
backend: pacman
skip_if_no_internet: true
update_db: false
update_system: false
pacman:
  num_retries: 2
  disable_download_timeout: false
  needed_only: true
