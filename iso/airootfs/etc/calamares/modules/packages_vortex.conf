# Instala las apps elegidas en la pantalla «Apps y juegos» (netinstall). Sin internet se
# salta: Vortex queda instalado igual y las apps se pueden poner después.
---
backend: pacman
skip_if_no_internet: true
update_db: true
update_system: false
pacman:
  num_retries: 2
  disable_download_timeout: false
  needed_only: true
