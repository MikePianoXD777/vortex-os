# Vortexine's OS: página «Teclado». Calamares 3.4 no tiene una opción para fijar la distribución con la
# que arranca la página; solo dos caminos: adivinarla por el idioma del sistema (guessLayout, lo
# normal) o quedarse con la que ya tenga systemd-localed. El adivinado falla justo con el español
# de Latinoamérica: busca primero el país (MX no es una distribución de XKB) y luego el idioma, así
# que es_MX, es_AR, es_CO... caen todos en «es» (España: otra ñ, otros símbolos), no en latam.
# Por eso aquí se apaga y vortex-instalador deja en localed la distribución que corresponde al
# idioma con el que abre Calamares (latam para es_MX y demás países de Latinoamérica, es para
# es_ES) antes de abrirlo. Si en la primera pantalla se elige otro idioma, la página de teclado
# conserva esa distribución hasta que se escoja otra en la lista.
#
# Lo que se elige aquí también cambia el teclado del escritorio del live (vortex-teclado-live
# escucha a localed), así que la contraseña y la frase de cifrado se escriben con ese teclado.
---
guessLayout: false

# El mismo archivo que escribe systemd-localed. No hay convertedKeymapPath: kbd de Arch no trae
# los keymaps de XKB ya convertidos, y sin él Calamares usa la tabla de systemd (kbd-model-map).
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"
