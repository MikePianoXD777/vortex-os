# Para instalar las apps elegidas: las llaves de pacman, los espejos y el DNS del USB pasan al disco.
#
# Espejos de CachyOS: el cachyos-mirrorlist del paquete empieza por cdn77 y us, que a veces van
# atrasados (404 en paquetes nuevos, p. ej. proton-cachyos-slr de Steam o los drivers de chwd), y
# deja cdn.cachyos.org y mirror.cachyos.org comentados. Aquí se ponen primero, igual que hace
# install/10-repos.sh fuera de CachyOS. Se hace al instalar y no en la imagen porque es donde
# importa: el live no baja nada de [cachyos]. Es idempotente (si cdn.cachyos.org ya está activo no
# toca nada) y no usa ${...} fuera de ${ROOT}: Calamares lo sustituiría (o fallaría si no existe).
---
dontChroot: true
timeout: 120
script:
  - "mkdir -p ${ROOT}/etc/pacman.d"
  - "cp -a /etc/pacman.d/gnupg ${ROOT}/etc/pacman.d/"
  - "cp /etc/pacman.d/mirrorlist ${ROOT}/etc/pacman.d/mirrorlist"
  - "-cp /etc/resolv.conf ${ROOT}/etc/resolv.conf"
  - command: |
      -for lista in ${ROOT}/etc/pacman.d/cachyos*-mirrorlist; do
        [ -f "$lista" ] || continue
        grep -q '^Server = https://cdn.cachyos.org' "$lista" && continue
        ruta=$(sed -n 's|^Server = https://[a-z0-9]*\.cachyos\.org\(/.*\)$|\1|p' "$lista" | head -n 1)
        [ -n "$ruta" ] || continue
        awk -v r="$ruta" '/^Server/ && !hecho { print "Server = https://cdn.cachyos.org" r; print "Server = https://mirror.cachyos.org" r; hecho = 1 } { print }' "$lista" >"$lista.vortex" &&
          cat "$lista.vortex" >"$lista"
        rm -f "$lista.vortex"
      done
    timeout: 60
i18n:
  name: "Preparing the package manager"
  name[es]: "Preparando el gestor de paquetes"
