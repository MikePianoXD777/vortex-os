# Después del gestor de arranque: entradas «Vortex OS» (linux-cachyos por defecto y el de Arch
# de respaldo) que apuntan a /vmlinuz-* e /initramfs-*.img, como deja install.sh.
---
dontChroot: false
timeout: 120
script:
  - command: "/usr/local/bin/vortex-post-instalacion arranque"
i18n:
  name: "Setting up the boot menu"
  name[es]: "Configurando el menú de arranque"
