# Antes de instalar las apps elegidas: llaveros al día y el sistema completo actualizado.
#
# La ISO es una foto de semanas o meses atrás. Si el módulo packages solo hiciera «pacman -Sy» y
# luego «pacman -S» de Steam, OBS, VLC, LibreOffice... sería una actualización parcial (justo lo
# que install/10-repos.sh prohíbe): los repos ya tienen otros sonames (ffmpeg, icu, boost) y pacman
# se niega o rompe dependencias; como netinstall no es crítico, cada app que falla se salta sin
# avisar. Aquí se sincroniza y se actualiza todo de una vez, y packages_vortex.conf ya no
# sincroniza por su cuenta (update_db: false).
#
# Es tolerante: va con «-» (Calamares sigue aunque falle) y solo corre con red, porque sin ella
# Vortex queda instalado igual y las apps se ponen después. Primero los llaveros (un llavero viejo
# no verifica las firmas nuevas de los repos y rompería el -Syu), después el -Syu. Corre en el
# disco nuevo (chroot): si se actualiza un kernel, el hook de mkinitcpio rehace su initramfs y lo
# copia a /boot, como en cualquier sistema instalado. No usa ${...} (Calamares lo sustituiría).
---
dontChroot: false
timeout: 3600
script:
  - command: |
      -curl -fsS --max-time 15 -o /dev/null https://archlinux.org || exit 0
      pacman -Sy --noconfirm --noprogressbar --needed archlinux-keyring cachyos-keyring
      pacman -Syu --noconfirm --noprogressbar
    timeout: 3600
i18n:
  name: "Updating the system"
  name[es]: "Actualizando el sistema"
