# systemd-boot, como deja install.sh. Cada kernel instalado (linux-cachyos y el de Arch de
# respaldo) tiene su entrada; Calamares agrega root= y, con btrfs, rootflags=subvol=@.
---
efiBootLoader: "systemd-boot"
kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"
loaderEntries:
  - "timeout 3"
  - "console-mode keep"
kernelParams: [ "quiet", "nowatchdog", "splash" ]
efiBootMgr: "efibootmgr"
efiBootloaderId: "vortex-os"
installEFIFallback: true
