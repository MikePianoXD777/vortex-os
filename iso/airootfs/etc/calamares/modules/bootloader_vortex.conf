# El gestor de arranque depende del firmware:
#  - UEFI: systemd-boot, como deja install.sh. Cada kernel instalado (linux-cachyos y el de Arch
#    de respaldo) tiene su entrada; Calamares agrega root= y, con btrfs, rootflags=subvol=@.
#  - BIOS/legacy: systemd-boot es solo UEFI, así que el módulo (main.py) cae en GRUB aunque aquí
#    diga systemd-boot (usa GRUB si "efiBootLoader == grub o el firmware no es EFI"). Para eso
#    lee grubInstall, grubMkconfig y grubCfg sin valor por omisión (sin ellos: KeyError y la
#    instalación se cancela al final, con el disco ya formateado). El menú sale de
#    /etc/default/grub (módulo grubcfg@vortex) y de /etc/default/grub.d/10-vortex.cfg
#    (vortex-post-instalacion grub), y el módulo vortex-bios le quita a Calamares lo que le
#    haría saltarse grub-install.
---
efiBootLoader: "systemd-boot"
kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"
loaderEntries:
  - "timeout 3"
  - "console-mode keep"
kernelParams: [ "quiet", "nowatchdog" ]
efiBootMgr: "efibootmgr"
efiBootloaderId: "vortex-os"
installEFIFallback: true
# Solo BIOS (GRUB)
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
