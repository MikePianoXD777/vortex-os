# Workspace de las apps de Vortexine en Rust (la reescritura: ver CONTRIBUIR.md).
# Las apps de Python de ../apps siguen igual hasta que su versión Rust las iguale.
[workspace]
resolver = "3"
members = [
    "crates/vortex-core",
    "apps/vortex-player",
    "apps/vortex-local-ai",
    "apps/vortex-local-ai/qt",
    "apps/vortex-bt-agente",
    "apps/vortex-tareas",
    "apps/vortex-usb",
    "apps/vortex-gestor",
    "crates/vortex-core-qt",
    "apps/vortex-video",
    "apps/vortex-video/qt",
    "apps/vortex-task-manager",
    "apps/vortex-task-manager/qt",
    "apps/vortex-runner",
    "apps/vortex-runner/qt",
    "apps/vortex-enlace",
    "apps/vortex-memoria",
    "apps/vortex-connect",
    "apps/vortex-connect/qt",
    "apps/vortex-shared",
    "apps/vortex-shared/qt",
    "apps/vortex-app-installer",
    "apps/vortex-app-installer/qt",
    "apps/vortex-shop",
    "apps/vortex-shop/qt",
    "apps/vortex-tirones",
    "apps/vortex-camera",
    "apps/vortex-camera/qt",
    "apps/vortex-player/qt",
    "apps/vortex-traducir",
    "apps/vortex-limpieza",
    "apps/vortex-escritorio",
    "apps/miku",
    "apps/miku/qt",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"          # MSRV: el mismo de rust-toolchain.toml
license = "MIT"
repository = "https://github.com/MikePianoXD777/vortex-os"

[workspace.dependencies]
vortex-core = { path = "crates/vortex-core" }
vortex-app-installer = { path = "apps/vortex-app-installer" }
rand = "0.9"
regex = "1"
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vortex-connect = { path = "apps/vortex-connect" }
vortex-shared = { path = "apps/vortex-shared" }
vortex-shop = { path = "apps/vortex-shop" }
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
# D-Bus sin tokio: ejecutor propio de zbus sobre async-io (menos RAM para un servicio que siempre corre).
zbus = { version = "=6.0.0" }
async-io = "2"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await-macro"] }
futures-channel = "0.3"
vortex-runner = { path = "apps/vortex-runner" }
vortex-video = { path = "apps/vortex-video" }
vortex-camera = { path = "apps/vortex-camera" }
vortex-local-ai = { path = "apps/vortex-local-ai" }
vortex-miku = { path = "apps/miku" }
vortex-task-manager = { path = "apps/vortex-task-manager" }
libc = "0.2"
# La interfaz es cxx-qt con versión FIJA (=0.10.0: es 0.x y cambia entre versiones; se sube a propósito).
cxx = "1"
cxx-qt = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["qt_gui", "qt_qml"] }
cxx-qt-build = { version = "=0.10.0", features = ["link_qt_object_files"] }

[workspace.lints.rust]
unsafe_code = "deny"            # el único unsafe permitido es el de cxx-qt (con #![allow] en su módulo) y el de libc del Task Manager

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
