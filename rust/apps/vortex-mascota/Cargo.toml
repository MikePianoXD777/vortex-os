[package]
name = "vortex-mascota"
description = "La compañera de escritorio de Vortexine's OS: un sprite de pixel art que camina por tu pantalla"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "vortex-mascota"
