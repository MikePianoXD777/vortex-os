# La ventana de Vortexine Video en Rust (cxx-qt), con los MISMOS QML de apps/vortex-video (no se copian).
# TODAVÍA FUERA DEL WORKSPACE: los crates de cxx-qt no se han bajado (ver ../README.md).
[package]
name = "vortex-video-qt"
description = "Vortexine Video en Rust: la ventana (cxx-qt) sobre el motor vortex-video"
version = "1.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[dependencies]
vortex-video = { path = ".." }
vortex-core = { path = "../../../crates/vortex-core" }
serde_json = "1"
cxx = "1"
cxx-qt = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["qt_gui", "qt_qml"] }

[build-dependencies]
cxx-qt-build = { version = "=0.10.0", features = ["link_qt_object_files"] }

[[bin]]
name = "vortex-video-rs"
path = "src/main.rs"
