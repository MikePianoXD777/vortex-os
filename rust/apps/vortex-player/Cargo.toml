[package]
name = "vortex-player"
description = "Vortex Player en Rust (en construcción: la app de Python sigue siendo la oficial)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "vortex_player"
path = "src/lib.rs"

[[bin]]
name = "vortex-player-rs"
path = "src/main.rs"

[dependencies]
rand = "0.9"
regex = "1"
rusqlite = { version = "0.34", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
vortex-core.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
