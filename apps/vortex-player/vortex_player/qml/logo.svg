  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="#0b0d1a"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="29.25" fill="none" stroke="url(#vp-borde)" stroke-width="1.5"/>
  <path d="M64 30a34 34 0 1 1-30.6 19.2" fill="none" stroke="url(#vp-onda)" stroke-width="9" stroke-linecap="round"/>
  <path d="M64 46a18 18 0 1 1-16.6 11" fill="none" stroke="url(#vp-onda)" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <g fill="url(#vp-onda)">
