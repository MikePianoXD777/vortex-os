  <defs>
    <linearGradient id="vp-onda" x1="16" y1="24" x2="112" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9ec5ff"/>
      <stop offset="1" stop-color="#c6a8ff"/>
    </linearGradient>
    <linearGradient id="vp-borde" x1="8" y1="8" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9ec5ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c6a8ff" stop-opacity="0.25"/>
