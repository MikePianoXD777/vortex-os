  <rect x="4" y="4" width="120" height="120" rx="30" fill="#0b0d1a"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="29.25" fill="none" stroke="url(#vc-borde)" stroke-width="1.5"/>
