<?xml version="1.0" encoding="UTF-8"?>
<!-- Vortexine's Camera: el lente de una cámara de seguridad dentro del remolino (el vórtice de
     Vortexine's), en los colores de Vortexine's OS. Dibujo original de este proyecto. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="vc-trazo" x1="16" y1="24" x2="112" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9ec5ff"/>
      <stop offset="1" stop-color="#c6a8ff"/>
    </linearGradient>
    <linearGradient id="vc-borde" x1="8" y1="8" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9ec5ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c6a8ff" stop-opacity="0.25"/>
