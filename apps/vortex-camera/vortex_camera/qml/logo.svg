  <circle cx="64" cy="64" r="27" fill="none" stroke="url(#vc-trazo)" stroke-width="8"/>
  <circle cx="64" cy="64" r="15" fill="url(#vc-lente)"/>
  <circle cx="58" cy="58" r="4.5" fill="#e8ebff" opacity="0.85"/>
