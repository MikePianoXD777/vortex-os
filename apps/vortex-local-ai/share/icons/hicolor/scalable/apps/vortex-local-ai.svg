<?xml version="1.0" encoding="UTF-8"?>
<!-- Vortexine's Local AI: una chispa (la IA) que sale de un remolino (el vórtice de Vortexine's) sobre
     una hoja de notas (el vault), en los colores de Vortexine's OS. Dibujo original de este proyecto. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="la-chispa" x1="36" y1="28" x2="96" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9ec5ff"/>
      <stop offset="1" stop-color="#c6a8ff"/>
    </linearGradient>
    <linearGradient id="la-borde" x1="8" y1="8" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9ec5ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c6a8ff" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="la-brillo" cx="64" cy="62" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c6a8ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c6a8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="#0b0d1a"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="29.25" fill="none" stroke="url(#la-borde)" stroke-width="1.5"/>
  <!-- la hoja de notas, atrás -->
  <path d="M30 26h44l16 16v58a4 4 0 0 1-4 4H30a4 4 0 0 1-4-4V30a4 4 0 0 1 4-4z" fill="#141833" stroke="#2c3366" stroke-width="2"/>
  <path d="M74 26v12a4 4 0 0 0 4 4h12" fill="none" stroke="#2c3366" stroke-width="2"/>
  <path d="M36 84h22M36 92h30" stroke="#3d4896" stroke-width="4" stroke-linecap="round"/>
  <!-- el remolino -->
  <path d="M64 30a32 32 0 1 1-29 18.5" fill="none" stroke="url(#la-chispa)" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  <circle cx="64" cy="62" r="34" fill="url(#la-brillo)"/>
  <!-- la chispa -->
  <path d="M64 34c2.6 14.6 9.4 21.4 24 24-14.6 2.6-21.4 9.4-24 24-2.6-14.6-9.4-21.4-24-24 14.6-2.6 21.4-9.4 24-24z" fill="url(#la-chispa)"/>
  <path d="M94 28c1 5.2 3.3 7.5 8.5 8.5-5.2 1-7.5 3.3-8.5 8.5-1-5.2-3.3-7.5-8.5-8.5 5.2-1 7.5-3.3 8.5-8.5z" fill="#c6a8ff"/>
</svg>
